services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: resqgrid
      POSTGRES_USER: resqgrid
      POSTGRES_PASSWORD: resqgrid_dev_password
    ports:
      - "5432:5432"
    volumes:
      - resqgrid_pg:/var/lib/postgresql/data
volumes:
  resqgrid_pg:
